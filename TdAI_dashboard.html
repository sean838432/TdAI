      <button onclick="switchTab('day_minus3')" id="btn-day_minus3" class="px-4 py-2.5 rounded-xl font-bold text-sm bg-slate-800/60 text-slate-400 border border-slate-700/40 hover:bg-slate-800 hover:text-slate-200 transition-all duration-150">Day -3 Verification</button>
      <button onclick="switchTab('day_minus4')" id="btn-day_minus4" class="px-4 py-2.5 rounded-xl font-bold text-sm bg-slate-800/60 text-slate-400 border border-slate-700/40 hover:bg-slate-800 hover:text-slate-200 transition-all duration-150">Day -4 Verification</button>

    <div id="error-banner" class="hidden mb-8 p-5 bg-red-950/40 border-l-4 border-red-500 text-red-300 font-medium rounded-lg shadow-md border border-red-900/30"></div>

    <main id="station-cards-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Station cards are injected here at load time by buildStationCardHTML() / renderStationCards(), in STATION_ORDER -->
    </main>

  <footer class="fixed bottom-0 inset-x-0 bg-slate-950/10 backdrop-blur border-t border-slate-800 py-2 text-center z-40">
    <p class="text-[12px] text-white">TdAI was developed by Sean Melanson at NWS Caribou</p>
  </footer>

  <script>
    // Left-to-right, top-to-bottom card order
    const STATION_ORDER = ['FVE', 'CAR', 'HUL', 'MLT', 'GNR', 'BGR'];

    let stationDatasets = {};   // station -> tabDataMap (or null if that station has no usable data)
    let currentTabActive = "day1";
    let changelogLoaded = false;
    let aboutLoaded = false;

    window.addEventListener('DOMContentLoaded', () => {
      renderStationCards();
      fetchDashboardDataFromCSV();
    });

    document.addEventListener('click', (e) => {
      const changelogDropdown = document.getElementById('changelog-dropdown');
      const aboutDropdown = document.getElementById('about-dropdown');

      if (!changelogDropdown.classList.contains('hidden')
          && !changelogDropdown.contains(e.target)
          && !document.getElementById('changelog-toggle-btn').contains(e.target)) {
        changelogDropdown.classList.add('hidden');
      }

      if (!aboutDropdown.classList.contains('hidden')
          && !aboutDropdown.contains(e.target)
          && !document.getElementById('about-toggle-btn').contains(e.target)) {
        aboutDropdown.classList.add('hidden');
      }

      // Close any open "See what's driving TdAI's prediction" dropdown
      // when clicking outside of it (native <details> only closes on
      // re-clicking its own <summary>, not on an outside click).
      document.querySelectorAll('details[id$="-drivers-panel"][open]').forEach(details => {
        if (!details.contains(e.target)) {
          details.open = false;
        }
      });
    });

    function toggleChangelog() {
      const dropdown = document.getElementById('changelog-dropdown');
      const willShow = dropdown.classList.contains('hidden');
      dropdown.classList.toggle('hidden');

      if (willShow && !changelogLoaded) {
        fetch('./CHANGELOG.txt', { cache: "no-store" })
          .then(res => {
            if (!res.ok) throw new Error("Not found");
            return res.text();
          })
          .then(text => {
            renderChangelog(text);
            changelogLoaded = true;
          })
          .catch(() => {
            document.getElementById('changelog-content').innerHTML =
              '<p class="text-xs text-rose-400 italic">Release notes unavailable.</p>';
          });
      }
    }

    function toggleAbout() {
      const dropdown = document.getElementById('about-dropdown');
      const willShow = dropdown.classList.contains('hidden');
      dropdown.classList.toggle('hidden');

      if (willShow && !aboutLoaded) {
        fetch('./ABOUT.txt', { cache: "no-store" })
          .then(res => {
            if (!res.ok) throw new Error("Not found");
            return res.text();
          })
          .then(text => {
            renderAbout(text);
            aboutLoaded = true;
          })
          .catch(() => {
            document.getElementById('about-content').innerHTML =
              '<p class="text-xs text-rose-400 italic">About information unavailable.</p>';
          });
      }
    }

    function renderAbout(rawText) {
      const container = document.getElementById('about-content');
      const text = rawText.trim();
      container.innerHTML = text
        ? parseMarkdown(text)
        : '<p class="text-xs text-slate-400 italic">No details provided yet.</p>';
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.innerText = str;
      return div.innerHTML;
    }

    // Minimal Markdown -> HTML: headings, hr, ordered/unordered lists
    // (with one level of nesting), bold, and italics. Not a full CommonMark parser.
    function inlineMarkdown(str) {
      let s = escapeHtml(str);
      s = s.replace(/\*\*(.+?)\*\*/g, '<strong class="text-slate-100 font-bold">$1</strong>');
      s = s.replace(/\*(.+?)\*/g, '<em>$1</em>');
      return s;
    }

    function parseMarkdown(rawText) {
      const lines = rawText.replace(/\r\n/g, '\n').split('\n');
      let html = '';
      let paragraphBuf = [];
      let list = null;

      const flushParagraph = () => {
        if (paragraphBuf.length) {
          html += `<p class="text-xs text-slate-300 leading-relaxed mb-2">${inlineMarkdown(paragraphBuf.join(' '))}</p>`;
          paragraphBuf = [];
        }
      };

      const flushList = () => {
        if (!list) return;
        const itemsHtml = list.items.map(item => {
          const subHtml = item.sub
            ? `<ul class="list-disc pl-4 mt-1 space-y-1 marker:text-indigo-400">${item.sub.map(s => `<li class="text-xs text-slate-300 leading-relaxed">${inlineMarkdown(s)}</li>`).join('')}</ul>`
            : '';
          return `<li class="text-xs text-slate-300 leading-relaxed">${inlineMarkdown(item.text)}${subHtml}</li>`;
        }).join('');
        const listClass = list.type === 'ol'
          ? 'list-decimal pl-4 space-y-1.5 mb-2 marker:text-indigo-400 marker:font-bold'
          : 'list-disc pl-4 space-y-1 mb-2 marker:text-indigo-400';
        html += `<${list.type} class="${listClass}">${itemsHtml}</${list.type}>`;
        list = null;
      };

      for (const rawLine of lines) {
        const line = rawLine.replace(/\s+$/, '');

        if (!line.trim()) {
          flushParagraph();
          flushList();
          continue;
        }

        if (/^-{3,}$/.test(line.trim())) {
          flushParagraph();
          flushList();
          html += '<hr class="border-slate-800 my-3">';
          continue;
        }

        const headingMatch = line.match(/^(#{1,6})\s+(.*)$/);
        if (headingMatch) {
          flushParagraph();
          flushList();
          const level = headingMatch[1].length;
          const sizeClass = level <= 2
            ? 'text-sm font-black text-indigo-400 mt-3 mb-1.5 tracking-tight'
            : 'text-xs font-bold text-slate-200 mt-2.5 mb-1';
          html += `<h${level} class="${sizeClass}">${inlineMarkdown(headingMatch[2])}</h${level}>`;
          continue;
        }

        const nestedBulletMatch = line.match(/^\s{2,}[*-]\s+(.*)$/);
        if (nestedBulletMatch && list && list.type === 'ol' && list.items.length) {
          const lastItem = list.items[list.items.length - 1];
          if (!lastItem.sub) lastItem.sub = [];
          lastItem.sub.push(nestedBulletMatch[1]);
          continue;
        }

        const orderedMatch = line.match(/^\d+\.\s+(.*)$/);
        if (orderedMatch) {
          flushParagraph();
          if (!list || list.type !== 'ol') { flushList(); list = { type: 'ol', items: [] }; }
          list.items.push({ text: orderedMatch[1] });
          continue;
        }

        const bulletMatch = line.match(/^[*-]\s+(.*)$/);
        if (bulletMatch) {
          flushParagraph();
          if (!list || list.type !== 'ul') { flushList(); list = { type: 'ul', items: [] }; }
          list.items.push({ text: bulletMatch[1] });
          continue;
        }

        flushList();
        paragraphBuf.push(line.trim());
      }

      flushParagraph();
      flushList();
      return html || '<p class="text-xs text-slate-400 italic">No details provided yet.</p>';
    }

    function renderChangelog(rawText) {
      const container = document.getElementById('changelog-content');
      const blocks = rawText.trim().split(/\n\s*\n/);

      const html = blocks.map((block, blockIdx) => {
        const lines = block.split('\n').map(l => l.trim()).filter(Boolean);
        if (lines.length === 0) return '';

        const versionTitle = lines[0];

        // Merge wrapped continuation lines back into their numbered item
        const items = [];
        for (let i = 1; i < lines.length; i++) {
          if (/^\d+\)/.test(lines[i])) {
            items.push(lines[i].replace(/^\d+\)\s*/, ''));
          } else if (items.length > 0) {
            items[items.length - 1] += ' ' + lines[i];
          }
        }

        const itemsHtml = items.map(item => `
          <li class="flex gap-2 text-xs text-slate-300 leading-relaxed">
            <span class="text-indigo-400 mt-0.5">&#8226;</span>
            <span>${escapeHtml(item)}</span>
          </li>
        `).join('');

        return `
          <div class="${blockIdx > 0 ? 'pt-3 border-t border-slate-800' : ''}">
            <span class="inline-block text-sm font-black text-indigo-400 mb-1.5 tracking-tight">${escapeHtml(versionTitle)}</span>
            <ul class="space-y-1.5">${itemsHtml}</ul>
          </div>
        `;
      }).join('');

      container.innerHTML = html || '<p class="text-xs text-slate-400 italic">No release notes found.</p>';
    }

    // -------------------------------------------------------------------
    // STATION CARD TEMPLATE - identical markup/behavior to the original
    // single-station KCAR card, just parameterized by station code so it
    // can be stamped out once per station in STATION_ORDER.
    // -------------------------------------------------------------------
    function buildStationCardHTML(station) {
      const s = station.toLowerCase();
      return `
      <div id="card-${station}" class="bg-slate-800 rounded-2xl shadow-xl border border-slate-700/60 overflow-visible transition-all duration-300 flex flex-col justify-between">
        <div>
          <div id="${s}-card-header" class="bg-slate-900 rounded-t-2xl px-5 py-3 border-b border-slate-700/50 text-white font-extrabold text-lg tracking-wide flex flex-wrap justify-between items-center gap-x-2 transition-colors duration-300">
            <span class="text-xl font-black text-white">K${station}</span>
            <span id="${s}-rfw-badge" class="hidden text-red-400 font-black text-xs sm:text-sm tracking-wide text-right"></span>
          </div>

          <div class="px-4 pt-4 pb-1.5 space-y-3">
            <div id="${s}-data-view" class="space-y-3">
              <div class="text-slate-400 text-sm font-medium bg-slate-900/30 p-3 rounded-xl border border-slate-700/30">
                <span class="block text-[11px] uppercase text-slate-500 font-black tracking-widest mb-0.5">NBM Baseline</span>
                <div class="text-slate-300 font-bold text-lg">
                  <span id="${s}-nbm-dew">--.-°F</span>
                  <span class="text-slate-600 mx-1.5 font-normal">/</span>
                  <span id="${s}-nbm-rh" class="text-slate-400 text-base">--% RH</span>
                </div>
              </div>

              <div class="bg-slate-900/40 p-3 rounded-xl border border-slate-700/30 flex justify-between items-center">
                <div>
                  <span class="block text-[11px] text-indigo-400 font-black tracking-widest mb-0.5">TdAI DETERMINISTIC FORECAST</span>
                  <div class="text-white font-black text-xl tracking-tight">
                    <span id="${s}-tdai-dew">--.-°F</span>
                    <span class="text-indigo-500 font-normal text-base mx-1">/</span>
                    <span id="${s}-tdai-rh" class="text-indigo-200 font-bold text-lg">--% RH</span>
                  </div>
                </div>
                <div id="${s}-badge" class="px-2.5 py-1 rounded-lg text-center font-black text-xs border min-w-[65px] bg-slate-900 text-slate-400 border-slate-700">
                  --.-°F
                </div>
              </div>

              <div id="${s}-probabilistic-panel" class="bg-slate-900/50 border border-slate-700/40 rounded-xl p-3.5 space-y-2">
                <span class="block text-[11px] text-sky-400 font-black tracking-widest">TdAI PROBABILISTIC DISTRIBUTION</span>

                <div class="grid grid-cols-5 gap-0.5 text-center bg-slate-950/40 p-2 rounded-xl border border-slate-800 text-xs items-stretch">

                  <div class="flex flex-col justify-between py-0.5 px-0.5">
                    <span class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider">10th</span>
                    <span id="${s}-val-q10" class="text-sm font-mono font-bold text-slate-300 mt-0.5">--.-°</span>
                  </div>

                  <div class="flex flex-col justify-between py-0.5 px-0.5">
                    <span class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider">25th</span>
                    <span id="${s}-val-q25" class="text-sm font-mono font-bold text-slate-300 mt-0.5">--.-°</span>
                  </div>

                  <div class="bg-sky-950/20 py-0.5 px-0.5 rounded border border-sky-900/30 flex flex-col justify-between shadow-inner">
                    <span class="block text-[11px] font-black text-sky-400 uppercase tracking-wider">Median</span>
                    <span id="${s}-val-q50" class="text-sm font-mono font-black text-white mt-0.5">--.-°</span>
                  </div>

                  <div class="flex flex-col justify-between py-0.5 px-0.5">
                    <span class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider">75th</span>
                    <span id="${s}-val-q75" class="text-sm font-mono font-bold text-slate-300 mt-0.5">--.-°</span>
                  </div>

                  <div class="flex flex-col justify-between py-0.5 px-0.5">
                    <span class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider">90th</span>
                    <span id="${s}-val-q90" class="text-sm font-mono font-bold text-slate-300 mt-0.5">--.-°</span>
                  </div>

                </div>
              </div>

              <details id="${s}-drivers-panel" class="hidden relative group">
                <summary class="cursor-pointer select-none list-none flex items-center justify-between text-[15px] text-slate-500 font-medium tracking-wide px-1">
                  <span>See what's driving TdAI's prediction:</span>
                  <span class="text-slate-600 group-open:rotate-180 transition-transform duration-150">▾</span>
                </summary>
                <!-- Absolutely positioned so opening this never grows the
                     card's own box height. -->
                <div class="absolute left-0 right-0 top-full mt-1.5 z-20 bg-slate-900 border border-slate-700 rounded-lg shadow-2xl p-2 max-h-52 overflow-y-auto">
                  <ul id="${s}-drivers-list" class="space-y-1 text-xs text-slate-400"></ul>
                </div>
              </details>

              <div id="${s}-verification-panel" class="hidden bg-indigo-950/20 border border-indigo-500/20 rounded-xl p-3 space-y-2">
                <span class="block text-[10px] text-indigo-400 font-black tracking-widest border-b border-indigo-900/40 pb-0.5">TdAI DETERMINISTIC VERIFICATION</span>
                <div class="grid grid-cols-2 gap-2 text-xs">
                  <div>
                    <span class="text-slate-500 text-[10px] block">ASOS Ground Truth:</span>
                    <span id="${s}-v-asos-dew" class="font-bold text-white text-sm">--.-°F</span>
                  </div>
                  <div>
                    <span class="text-slate-500 text-[10px] block">TdAI Median Skill:</span>
                    <span id="${s}-v-skill-score" class="font-extrabold text-sm">--.-%</span>
                  </div>
                  <div>
                    <span class="text-slate-500 text-[10px] block">Original NBM Error:</span>
                    <span id="${s}-v-nbm-err" class="font-medium text-slate-300">--.-°F</span>
                  </div>
                  <div>
                    <span class="text-slate-500 text-[10px] block">Post TdAI Error:</span>
                    <span id="${s}-v-tdai-err" class="font-medium text-slate-300">--.-°F</span>
                  </div>
                </div>
              </div>
            </div>

            <div id="${s}-empty-view" class="hidden py-8 text-center text-slate-400 font-bold italic text-xs bg-slate-900/20 border border-slate-800/60 rounded-xl">
              No Data Available
            </div>
          </div>
        </div>
      </div>
      `;
    }

    function renderStationCards() {
      const container = document.getElementById('station-cards-container');
      container.innerHTML = STATION_ORDER.map(station => buildStationCardHTML(station)).join('');
    }

    // -------------------------------------------------------------------
    // DATA LOADING - each station's deterministic + probabilistic CSVs are
    // fetched independently (Promise.allSettled) so one missing/late
    // station doesn't break the rest of the dashboard.
    // -------------------------------------------------------------------
    function fetchDashboardDataFromCSV() {
      const fetchPromises = STATION_ORDER.map(station => {
        const detPath = `./deterministic_output/TdAI_deterministic_operational_${station}.csv`;
        const probPath = `./probabilistic_output/TdAI_probabilistic_operational_${station}.csv`;

        return Promise.all([
          fetch(detPath, { cache: "no-store" }).then(res => {
            if (!res.ok) throw new Error(`${detPath} not found`);
            return res.text();
          }),
          fetch(probPath, { cache: "no-store" }).then(res => res.ok ? res.text() : "").catch(() => "")
        ])
        .then(([detText, probText]) => {
          stationDatasets[station] = buildTabDataMapForStation(detText, probText);
        })
        .catch(() => {
          stationDatasets[station] = null;
        });
      });

      Promise.allSettled(fetchPromises).then(() => {
        const anyStationLoaded = STATION_ORDER.some(station => stationDatasets[station]);
        if (!anyStationLoaded) {
          handleCriticalError("Operational Failure: Could not synchronize with database stream objects for any station. Check repository file logs.");
          return;
        }
        switchTab(currentTabActive);
      });
    }

    function buildTabDataMapForStation(detText, probText) {
      const detLines = detText.trim().split('\n');
      const probLines = probText.trim() ? probText.trim().split('\n') : [];

      if (detLines.length < 2 || !detText.trim()) {
        return null;
      }

      const detHeaders = parseCSVLine(detLines[0]);
      const probHeaders = probLines.length ? parseCSVLine(probLines[0]) : [];

      const idxValidTime = detHeaders.indexOf('valid_time');
      const idxTdaiStatus = detHeaders.indexOf('TdAI Status');
      const idxNbmTemp   = detHeaders.indexOf('NBM Temperature (F)');
      const idxNbmDew    = detHeaders.indexOf('NBM Dewpoint (F)');
      const idxNbmRh     = detHeaders.indexOf('NBM RH (%)');
      const idxNbmGust   = detHeaders.indexOf('NBM Max Wind Gust 15-21Z (kts)');
      const idxTdaiDew   = detHeaders.indexOf('TdAI Corrected Dewpoint (F)');
      const idxRunTime   = detHeaders.indexOf('TdAI Run Time (UTC)');
      const idxAsosDew   = detHeaders.indexOf('ASOS Ground Truth Dewpoint (F)');
      const idxNbmErr    = detHeaders.indexOf('Raw NBM Error (F)');
      const idxTdaiErr   = detHeaders.indexOf('Post TdAI Error (F)');
      const idxSkill     = detHeaders.indexOf('TdAI Skill Score (%)');
      const idxTopDrivers = detHeaders.indexOf('TdAI Top Drivers');

      const idxPValidTime = probHeaders.indexOf('valid_time');
      const idxPq10 = probHeaders.indexOf('TdAI_Corrected_Dewpoint_q10');
      const idxPq25 = probHeaders.indexOf('TdAI_Corrected_Dewpoint_q25');
      const idxPq50 = probHeaders.indexOf('TdAI_Corrected_Dewpoint_q50');
      const idxPq75 = probHeaders.indexOf('TdAI_Corrected_Dewpoint_q75');
      const idxPq90 = probHeaders.indexOf('TdAI_Corrected_Dewpoint_q90');

      const tabDataMap = {
        'day1': null, 'day2': null, 'day_minus1': null,
        'day_minus2': null, 'day_minus3': null, 'day_minus4': null, 'day_minus5': null
      };

      const probLookup = {};
      for (let j = 1; j < probLines.length; j++) {
        if (!probLines[j].trim()) continue;
        const pRow = parseCSVLine(probLines[j]);
        if (idxPValidTime !== -1 && pRow[idxPValidTime]) {
          probLookup[pRow[idxPValidTime].replace(/"/g, '').trim()] = pRow;
        }
      }

      const validRows = [];
      for (let i = 1; i < detLines.length; i++) {
        if (detLines[i].trim()) validRows.push(parseCSVLine(detLines[i]));
      }

      validRows.sort((a, b) => a[idxValidTime].localeCompare(b[idxValidTime]));
      const totalRecords = validRows.length;

      function processRowData(row) {
        const rowValidTimeStr = row[idxValidTime];
        const cleanTimeStr = rowValidTimeStr.replace(/"/g, '').trim();
        const statusText = (idxTdaiStatus !== -1 && row[idxTdaiStatus]) ? row[idxTdaiStatus].replace(/"/g, '').trim() : "Active";
        const isBypassed = statusText !== "Active" && statusText !== "";

        const nbmTemp = parseFloat(row[idxNbmTemp]);
        const nbmDew  = parseFloat(row[idxNbmDew]);
        const nbmRh   = parseFloat(row[idxNbmRh]);
        const nbmGustKts = parseFloat(row[idxNbmGust]);
        const tdaiDew = parseFloat(row[idxTdaiDew]);
        const rowRunTimeStr = row[idxRunTime] ? row[idxRunTime].replace(/"/g, '').trim() : "N/A";

        const matchingProbRow = probLookup[cleanTimeStr];

        let parsedRowObj = {
          validTimeStr: cleanTimeStr.substring(0, 16),
          runTimeStr: rowRunTimeStr,
          status: statusText,
          isBypassed: isBypassed,
          nbmDew: isNaN(nbmDew) ? "--.-" : nbmDew.toFixed(1),
          nbmRh: "--",
          tdaiDew: isNaN(tdaiDew) ? "--.-" : tdaiDew.toFixed(1),
          tdaiRh: "--",
          gustMph: "--",
          rfw: { nbmMet: false, tdaiMet: false },
          delta: "--.-",
          deltaValue: 0.0,
          isVerified: false,
          verification: { asosDew: null, nbmErr: null, tdaiErr: null, skillScore: null },
          probabilistic: { q10: null, q25: null, q50: null, q75: null, q90: null },
          topDrivers: (idxTopDrivers !== -1 && row[idxTopDrivers]) ? row[idxTopDrivers].replace(/"/g, '').trim() : ""
        };

        if (matchingProbRow) {
          parsedRowObj.probabilistic.q10 = parseFloat(matchingProbRow[idxPq10]);
          parsedRowObj.probabilistic.q25 = parseFloat(matchingProbRow[idxPq25]);
          parsedRowObj.probabilistic.q50 = parseFloat(matchingProbRow[idxPq50]);
          parsedRowObj.probabilistic.q75 = parseFloat(matchingProbRow[idxPq75]);
          parsedRowObj.probabilistic.q90 = parseFloat(matchingProbRow[idxPq90]);
        }

        if (!isBypassed) {
          const tempF = !isNaN(nbmTemp) ? nbmTemp : null;
          const nbmDewF = !isNaN(nbmDew) ? nbmDew : null;
          const tdaiDewF = !isNaN(tdaiDew) ? tdaiDew : null;

          if (tempF !== null) {
            const tc = (tempF - 32) * (5.0 / 9.0);
            const es = 6.112 * Math.exp((17.67 * tc) / (tc + 243.5));

            let nbmRhNum = null;
            if (!isNaN(nbmRh)) {
              nbmRhNum = nbmRh;
            } else if (nbmDewF !== null) {
              const tdc_nbm = (nbmDewF - 32) * (5.0 / 9.0);
              const e_nbm = 6.112 * Math.exp((17.67 * tdc_nbm) / (tdc_nbm + 243.5));
              nbmRhNum = Math.min(Math.max((e_nbm / es) * 100, 0.0), 100.0);
            }
            if (nbmRhNum !== null) parsedRowObj.nbmRh = nbmRhNum.toFixed(0);

            let tdaiRhNum = null;
            if (tdaiDewF !== null) {
              const tdc_tdai = (tdaiDewF - 32) * (5.0 / 9.0);
              const e_tdai = 6.112 * Math.exp((17.67 * tdc_tdai) / (tdc_tdai + 243.5));
              tdaiRhNum = Math.min(Math.max((e_tdai / es) * 100, 0.0), 100.0);
            }
            if (tdaiRhNum !== null) parsedRowObj.tdaiRh = tdaiRhNum.toFixed(0);

            // Red Flag Warning criteria: RH < 30% and wind gust > 25 mph.
            // NBM reports gust in knots, so convert (1 kt = 1.15078 mph).
            // Checked against both NBM's own RH and TdAI's corrected RH -
            // same gust value for both, since TdAI only corrects dewpoint
            // and has no wind forecast of its own.
            if (!isNaN(nbmGustKts)) {
              const gustMph = nbmGustKts * 1.15078;
              parsedRowObj.gustMph = gustMph.toFixed(0);
              const gustMet = gustMph > 25;
              parsedRowObj.rfw.nbmMet = gustMet && nbmRhNum !== null && nbmRhNum < 30;
              parsedRowObj.rfw.tdaiMet = gustMet && tdaiRhNum !== null && tdaiRhNum < 30;
            }
          }

          const delta = (tdaiDewF !== null && nbmDewF !== null) ? tdaiDewF - nbmDewF : null;
          if (delta !== null) {
            parsedRowObj.delta = delta.toFixed(1);
            parsedRowObj.deltaValue = delta;
          }

          const hasAsos = row[idxAsosDew] !== "" && row[idxAsosDew] !== undefined && row[idxAsosDew] !== null && !isNaN(parseFloat(row[idxAsosDew]));
          const asosDew = hasAsos ? parseFloat(row[idxAsosDew]) : null;
          const nbmErr  = (row[idxNbmErr] !== "" && row[idxNbmErr] !== undefined) ? parseFloat(row[idxNbmErr]) : null;
          const tdaiErr = (row[idxTdaiErr] !== "" && row[idxTdaiErr] !== undefined) ? parseFloat(row[idxTdaiErr]) : null;
          const skill   = (row[idxSkill] !== "" && row[idxSkill] !== undefined) ? parseFloat(row[idxSkill]) : null;

          parsedRowObj.isVerified = hasAsos;
          parsedRowObj.verification = {
            asosDew: hasAsos ? asosDew.toFixed(1) : null,
            nbmErr: (nbmErr !== null && !isNaN(nbmErr)) ? nbmErr.toFixed(1) : null,
            tdaiErr: (tdaiErr !== null && !isNaN(tdaiErr)) ? tdaiErr.toFixed(1) : null,
            skillScore: (skill !== null && !isNaN(skill)) ? skill.toFixed(1) : null
          };
        }
        return parsedRowObj;
      }

      if (totalRecords > 1) {
        tabDataMap['day1'] = processRowData(validRows[totalRecords - 2]);
        tabDataMap['day2'] = processRowData(validRows[totalRecords - 1]);
      } else if (totalRecords > 0) {
        tabDataMap['day1'] = processRowData(validRows[totalRecords - 1]);
      }
      if (totalRecords > 2) tabDataMap['day_minus1'] = processRowData(validRows[totalRecords - 3]);
      if (totalRecords > 3) tabDataMap['day_minus2'] = processRowData(validRows[totalRecords - 4]);
      if (totalRecords > 4) tabDataMap['day_minus3'] = processRowData(validRows[totalRecords - 5]);
      if (totalRecords > 5) tabDataMap['day_minus4'] = processRowData(validRows[totalRecords - 6]);
      if (totalRecords > 6) tabDataMap['day_minus5'] = processRowData(validRows[totalRecords - 7]);

      return tabDataMap;
    }

    // -------------------------------------------------------------------
    // "See what's driving TdAI's prediction" dropdown - parses the
    // 'TdAI Top Drivers' column written by the operational scripts'
    // per-row SHAP explainer (format: "feature: +/-X.XXF | feature: ...").
    // -------------------------------------------------------------------
    const FEATURE_LABELS = {
      'NBM Temperature (F)': 'NBM Forecast Temperature',
      'NBM Cloud Cover (%)': 'NBM Cloud Cover (15Z-21Z avg)',
      'NBM Mixing Height (100s ft AGL)': 'NBM Mixing Height',
      'NBM Wind Speed (kts)': 'NBM Wind Speed',
      'NBM Wind Direction (deg)': 'NBM Wind Direction',
      'NBM RH (%)': 'NBM Relative Humidity',
      'hrrr_lpw (mm)': 'HRRR Precipitable Water',
      '1000mb-700mb Lapse Rate (C/km)': 'Low-Level Lapse Rate (1000-700mb)',
      '700mb-500mb Lapse Rate (C/km)': 'Mid-Level Lapse Rate (700-500mb)',
      'sin_season': 'Time of Year',
      'cos_season': 'Time of Year',
    };

    function friendlyFeatureLabel(rawName) {
      if (FEATURE_LABELS[rawName]) return FEATURE_LABELS[rawName];
      const rhMatch = rawName.match(/^rh_(\d+)$/);
      if (rhMatch) return `${rhMatch[1]}mb Relative Humidity`;
      return rawName;
    }

    function parseTopDrivers(topDriversStr) {
      if (!topDriversStr) return [];
      return topDriversStr.split('|').map(part => {
        const idx = part.lastIndexOf(':');
        if (idx === -1) return null;
        const rawName = part.slice(0, idx).trim();
        const rawVal = part.slice(idx + 1).trim();
        const value = parseFloat(rawVal);
        if (!rawName || isNaN(value)) return null;
        return { label: friendlyFeatureLabel(rawName), value: value };
      }).filter(Boolean);
    }

    function renderDriversPanel(station, topDriversStr) {
      const s = station.toLowerCase();
      const panel = document.getElementById(`${s}-drivers-panel`);
      const list = document.getElementById(`${s}-drivers-list`);
      const drivers = parseTopDrivers(topDriversStr);

      if (!drivers.length) {
        panel.classList.add('hidden');
        return;
      }

      panel.classList.remove('hidden');
      list.innerHTML = drivers.map(d => {
        const arrow = d.value > 0 ? '▲' : '▼';
        const arrowColor = d.value > 0 ? 'text-emerald-400' : 'text-rose-400';
        const sign = d.value > 0 ? '+' : '';
        return `
          <li class="flex justify-between items-center gap-2 bg-slate-950/30 rounded-lg px-2 py-1 border border-slate-800/60 text-slate-400">
            <span class="font-medium">${d.label}</span>
            <span class="font-mono whitespace-nowrap"><span class="${arrowColor}">${arrow}</span> ${sign}${d.value.toFixed(2)}°F</span>
          </li>
        `;
      }).join('');
    }

    function parseCSVLine(line) {
      let arr = [];
      let quote = false;
      let str = '';
      for (let i = 0; i < line.length; i++) {
        let ch = line[i];
        if (ch === '"') quote = !quote;
        else if (ch === ',' && !quote) {
          arr.push(str.trim());
          str = '';
        } else str += ch;
      }
      arr.push(str.trim());
      return arr;
    }

    function switchTab(tabKey) {
      currentTabActive = tabKey;

      const tabButtons = document.querySelectorAll('nav button');
      tabButtons.forEach(btn => {
        if (btn.id === `btn-${tabKey}`) {
          btn.className = "px-4 py-2.5 rounded-xl font-bold text-sm bg-indigo-600 text-white shadow-md transition-all duration-150";
        } else {
          btn.className = "px-4 py-2.5 rounded-xl font-bold text-sm bg-slate-800/60 text-slate-400 border border-slate-700/40 hover:bg-slate-800 hover:text-slate-200 transition-all duration-150";
        }
      });

      // The header line shows one shared Valid Time / Model Run for the
      // active tab - all stations are drawn from the same HRRR/NBM cycle,
      // so the first station with a usable row for this tab is representative.
      const isVerificationTab = tabKey.startsWith('day_minus');
      const runLabel = isVerificationTab ? 'Model Run' : 'Latest Model Run';
      const metaHeader = document.getElementById('meta-timestamps');
      const representativeData = STATION_ORDER
        .map(station => stationDatasets[station] ? stationDatasets[station][tabKey] : null)
        .find(data => data);

      if (representativeData) {
        metaHeader.innerHTML = `Valid Time: <span class="text-indigo-400 font-bold">${representativeData.validTimeStr} UTC</span> &nbsp;|&nbsp; ${runLabel}: <span class="text-slate-200 font-bold">${representativeData.runTimeStr}</span>`;
      } else {
        metaHeader.innerHTML = `Target Window: <span class="text-rose-400 font-bold">No Forecast Row In Sync Yet</span>`;
      }

      STATION_ORDER.forEach(station => renderStationTab(station, tabKey));
    }

    // Red Flag Warning highlighting for a station card's header - "NBM
    // and TdAI reached RFW criteria" if both hit RH<30%/gust>25mph,
    // "TdAI reached RFW criteria" if only TdAI's corrected RH does
    // (TdAI's guardrail never raises Td above NBM's, so TdAI's RH can
    // never be higher than NBM's - "NBM met but TdAI didn't" can't occur).
    function applyRfwStyling(station, rfw) {
      const s = station.toLowerCase();
      const cardEl = document.getElementById(`card-${station}`);
      const headerEl = document.getElementById(`${s}-card-header`);
      const badgeEl = document.getElementById(`${s}-rfw-badge`);

      if (rfw && rfw.tdaiMet) {
        badgeEl.textContent = rfw.nbmMet ? 'NBM and TdAI reached RFW criteria' : 'TdAI reached RFW criteria';
        badgeEl.classList.remove('hidden');
        headerEl.className = "bg-red-950/60 rounded-t-2xl px-5 py-3 border-b border-red-600/50 text-white font-extrabold text-lg tracking-wide flex flex-wrap justify-between items-center gap-x-2 transition-colors duration-300";
        // bg-red-950 tints the whole card, not just the header - the
        // semi-transparent slate panels inside (NBM Baseline, TdAI
        // Deterministic, etc.) sit on top of this and pick up the same
        // red cast since their own backgrounds are alpha < 1.
        cardEl.className = "bg-red-950 rounded-2xl shadow-xl border-2 border-red-600/70 ring-2 ring-red-600/20 overflow-visible transition-all duration-300 flex flex-col justify-between";
      } else {
        badgeEl.textContent = '';
        badgeEl.classList.add('hidden');
        headerEl.className = "bg-slate-900 rounded-t-2xl px-5 py-3 border-b border-slate-700/50 text-white font-extrabold text-lg tracking-wide flex flex-wrap justify-between items-center gap-x-2 transition-colors duration-300";
        cardEl.className = "bg-slate-800 rounded-2xl shadow-xl border border-slate-700/60 overflow-visible transition-all duration-300 flex flex-col justify-between";
      }
    }

    function renderStationTab(station, tabKey) {
      const s = station.toLowerCase();
      const stationTabs = stationDatasets[station];
      const data = stationTabs ? stationTabs[tabKey] : null;

      applyRfwStyling(station, (data && !data.isBypassed) ? data.rfw : null);

      const dataView = document.getElementById(`${s}-data-view`);
      const emptyView = document.getElementById(`${s}-empty-view`);
      const probPanel = document.getElementById(`${s}-probabilistic-panel`);

      if (!data) {
        dataView.classList.add('hidden');
        emptyView.classList.remove('hidden');
        emptyView.innerText = "No Data Available";
        return;
      }

      if (data.isBypassed) {
        dataView.classList.add('hidden');
        emptyView.classList.remove('hidden');
        emptyView.innerHTML = `No Data Available <span class="block text-xs font-medium text-slate-500 mt-1 not-italic">TdAI Run Bypassed &rarr; ${data.status}</span>`;
        return;
      }

      dataView.classList.remove('hidden');
      emptyView.classList.add('hidden');

      document.getElementById(`${s}-nbm-dew`).innerText = data.nbmDew + "°F";
      document.getElementById(`${s}-nbm-rh`).innerText = data.nbmRh + "% RH";
      document.getElementById(`${s}-tdai-dew`).innerText = data.tdaiDew + "°F";
      document.getElementById(`${s}-tdai-rh`).innerText = data.tdaiRh + "% RH";

      const badge = document.getElementById(`${s}-badge`);
      const delta = data.deltaValue;
      badge.innerText = (delta >= 0 ? "-" : "") + data.delta + "°F";

      const baseBadgeStyle = "px-3 py-1.5 rounded-lg text-center font-black text-sm border min-w-[75px] ";
      if (delta === 0) {
        badge.className = baseBadgeStyle + "bg-slate-800 text-slate-400 border-slate-700";
      } else if (delta > 0) {
        badge.className = baseBadgeStyle + "bg-emerald-950/50 text-emerald-400 border-emerald-800/40";
      } else {
        badge.className = baseBadgeStyle + "bg-[#3e2723]/75 text-[#a1887f] border-[#5d4037]/40";
      }

      if (data.probabilistic && data.probabilistic.q10 !== null && !isNaN(data.probabilistic.q10) && data.probabilistic.q90 !== null && !isNaN(data.probabilistic.q90)) {
        probPanel.classList.remove('hidden');

        const q10 = data.probabilistic.q10;
        const q25 = data.probabilistic.q25;
        const q50 = data.probabilistic.q50;
        const q75 = data.probabilistic.q75;
        const q90 = data.probabilistic.q90;

        document.getElementById(`${s}-val-q10`).innerText = q10.toFixed(1) + "°F";
        document.getElementById(`${s}-val-q25`).innerText = q25.toFixed(1) + "°F";
        document.getElementById(`${s}-val-q50`).innerText = q50.toFixed(1) + "°F";
        document.getElementById(`${s}-val-q75`).innerText = q75.toFixed(1) + "°F";
        document.getElementById(`${s}-val-q90`).innerText = q90.toFixed(1) + "°F";
      } else {
        probPanel.classList.add('hidden');
      }

      renderDriversPanel(station, data.topDrivers);

      const vPanel = document.getElementById(`${s}-verification-panel`);
      if (data.isVerified) {
        vPanel.classList.remove('hidden');
        document.getElementById(`${s}-v-asos-dew`).innerText = data.verification.asosDew + "°F";

        const nbmErr = parseFloat(data.verification.nbmErr);
        const tdaiErr = parseFloat(data.verification.tdaiErr);
        document.getElementById(`${s}-v-nbm-err`).innerText = (nbmErr >= 0 ? "+" : "") + data.verification.nbmErr + "°F";
        document.getElementById(`${s}-v-tdai-err`).innerText = (tdaiErr >= 0 ? "+" : "") + data.verification.tdaiErr + "°F";

        const skillScore = parseFloat(data.verification.skillScore);
        const skillNode = document.getElementById(`${s}-v-skill-score`);
        skillNode.innerText = (skillScore >= 0 ? "+" : "") + data.verification.skillScore + "%";

        if (skillScore > 0) {
          skillNode.className = "font-black text-base text-emerald-400";
        } else if (skillScore === 0) {
          skillNode.className = "font-black text-base text-slate-400";
        } else {
          skillNode.className = "font-black text-base text-rose-400";
        }
      } else {
        vPanel.classList.add('hidden');
      }
    }

    function handleCriticalError(errorMsg) {
      const banner = document.getElementById('error-banner');
      banner.innerText = errorMsg;
      banner.classList.remove('hidden');

      alert("CRITICAL JAVASCRIPT ERROR:\n" + errorMsg);
    }
  </script>
</body>
</html>
